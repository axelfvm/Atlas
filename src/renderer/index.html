<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="browser-chrome">
      <div class="tab-strip" aria-label="Abas">
        <div class="brand" aria-label="Atlas">
          <span class="brand-mark" aria-hidden="true">A</span>
        </div>
        <div class="active-tab">
          <span class="tab-orbit" aria-hidden="true"></span>
          <span id="tab-title" class="tab-title">Nova guia</span>
        </div>
        <div class="window-drag-space" aria-hidden="true"></div>
      </div>

      <nav class="toolbar" aria-label="Navegação">
        <button id="back" class="nav-button" type="button" aria-label="Voltar" title="Voltar (Alt+Esquerda)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7" /></svg>
        </button>
        <button id="forward" class="nav-button" type="button" aria-label="Avançar" title="Avançar (Alt+Direita)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7" /></svg>
        </button>
        <button id="reload" class="nav-button" type="button" aria-label="Recarregar" title="Recarregar (Ctrl+R)">
          <svg class="reload-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" /></svg>
          <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" /></svg>
        </button>
        <button id="home" class="nav-button" type="button" aria-label="Página inicial" title="Página inicial">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9h-6v-6h-4v6H4z" /></svg>
        </button>

        <form id="address-form" class="address-bar" autocomplete="off">
          <span id="security-indicator" class="security-indicator" aria-label="Informações do site">
            <svg class="secure-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6z" /></svg>
            <svg class="web-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" /></svg>
          </span>
          <label class="sr-only" for="address">Pesquisar ou digitar endereço</label>
          <input
            id="address"
            name="address"
            type="text"
            inputmode="url"
            spellcheck="false"
            placeholder="Pesquisar ou digitar endereço"
            aria-label="Pesquisar ou digitar endereço"
          />
          <span id="loading-dot" class="loading-dot" aria-hidden="true"></span>
        </form>

        <button class="nav-button menu-button" type="button" aria-label="Menu do Atlas" title="Menu do Atlas" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" /></svg>
        </button>
      </nav>
    </header>

    <script src="renderer.js"></script>
  </body>
</html>
