<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar" aria-label="Navegação do Atlas">
      <header class="sidebar-header">
        <div class="atlas-brand" aria-label="Atlas">
          <span class="atlas-mark" aria-hidden="true">
            <span class="atlas-meridian"></span>
          </span>
          <span class="atlas-name">Atlas</span>
        </div>
        <button
          id="toggle-sidebar"
          class="icon-button sidebar-toggle"
          type="button"
          aria-label="Recolher barra lateral"
          title="Recolher barra lateral"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <path d="M9 4v16" />
          </svg>
        </button>
      </header>

      <section class="favorites-section" aria-labelledby="favorites-title">
        <div class="favorites-heading">
          <h2 id="favorites-title" class="section-title">Atalhos</h2>
          <button id="add-shortcut" class="add-shortcut" type="button" aria-label="Adicionar a página atual aos atalhos" title="Adicionar página atual">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
        <div id="shortcuts-grid" class="favorites-grid"></div>
        <p id="shortcuts-empty" class="shortcuts-empty">Abra um site e use <strong>+</strong> para salvar seu primeiro atalho.</p>
      </section>

      <div class="sidebar-divider"></div>

      <section class="workspace" aria-labelledby="workspace-title">
        <div class="workspace-heading">
          <span class="workspace-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19h16M6 19l2-9 4-5 4 5 2 9M8 10h8M7 14h10" /></svg>
          </span>
          <div class="workspace-copy">
            <span class="workspace-kicker">Espaço</span>
            <h2 id="workspace-title">Exploração</h2>
          </div>
        </div>

        <button id="new-tab" class="new-tab-button" type="button" title="Nova guia (Ctrl+T)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>Nova guia</span>
          <kbd>Ctrl T</kbd>
        </button>

        <ul id="tabs-list" class="tabs-list" aria-label="Guias abertas"></ul>
      </section>

      <footer class="sidebar-footer">
        <button id="update-status" class="update-status" type="button" hidden>
          <span class="update-orbit" aria-hidden="true"><span></span></span>
          <span class="update-copy">
            <strong id="update-title">Atualizando o Atlas</strong>
            <small id="update-detail">Baixando em segundo plano</small>
          </span>
          <svg class="update-action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" /></svg>
        </button>
        <button class="profile-button" type="button" disabled aria-label="Perfil do Atlas">
          <span class="profile-avatar" aria-hidden="true">A</span>
          <span class="profile-copy">
            <strong>Navegador Atlas</strong>
            <small>Sessão local</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" /></svg>
        </button>
      </footer>
    </aside>

    <header class="topbar">
      <nav class="history-controls" aria-label="Histórico de navegação">
        <button id="back" class="icon-button" type="button" aria-label="Voltar" title="Voltar (Alt+Esquerda)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7" /></svg>
        </button>
        <button id="forward" class="icon-button" type="button" aria-label="Avançar" title="Avançar (Alt+Direita)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7" /></svg>
        </button>
        <button id="reload" class="icon-button" type="button" aria-label="Recarregar" title="Recarregar (Ctrl+R)">
          <svg class="reload-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" /></svg>
          <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z" /></svg>
        </button>
      </nav>

      <form id="address-form" class="address-bar" autocomplete="off">
        <span id="security-indicator" class="security-indicator" aria-label="Informações do site">
          <svg class="secure-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6z" /></svg>
          <svg class="web-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" /></svg>
        </span>
        <label class="sr-only" for="address">Pesquisar ou digitar endereço</label>
        <input
          id="address"
          name="address"
          type="text"
          inputmode="url"
          spellcheck="false"
          placeholder="Para onde vamos?"
          aria-label="Pesquisar ou digitar endereço"
        />
        <span id="loading-orbit" class="loading-orbit" aria-hidden="true"><span></span></span>
      </form>

      <div class="topbar-actions">
        <button id="home" class="icon-button" type="button" aria-label="Página inicial" title="Página inicial">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9h-6v-6h-4v6H4z" /></svg>
        </button>
        <button class="icon-button" type="button" aria-label="Menu do Atlas" title="Menu do Atlas" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" /></svg>
        </button>
      </div>
    </header>

    <div class="content-frame" aria-hidden="true"></div>
    <script src="renderer.js"></script>
  </body>
</html>
