name: Protótipo Electron (execução manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-windows:
    name: Validar protótipo legado
    runs-on: windows-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Verificar código
        run: npm run check

      - name: Gerar pacote local do protótipo
        run: npm run pack
